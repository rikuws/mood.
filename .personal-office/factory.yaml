version: 1
linear:
  team: Rikuws
  project: "mood."
codex:
  project: pinax
  environment: worktree
base_branch: main
commands:
  setup: xcodegen generate
  static_check: swift package describe
  test: swift test && (cd NativeHost && swift test) && (cd Mac/BrowserIntegration && swift test) && (cd BrowserExtension && npm test)
  build: (cd BrowserExtension && npm run build) && xcodegen generate && xcodebuild -project Pinax.xcodeproj -scheme PinaxMac -destination 'platform=macOS' -derivedDataPath /tmp/PinaxFactoryDerivedData CODE_SIGNING_ALLOWED=NO build && xcodebuild -project Pinax.xcodeproj -scheme PinaxiOS -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/PinaxFactoryDerivedData CODE_SIGNING_ALLOWED=NO build
  run: open /tmp/PinaxFactoryDerivedData/Build/Products/Debug/Pinax.app
verification:
  surface: macos
  runtime_required: true
  screenshots: on-visible-change
  persistence_required: true
limits:
  max_minutes: 45
  max_repair_cycles: 2
authority:
  merge: principal-approval
  deploy: principal-approval
  external_effects: principal-approval
